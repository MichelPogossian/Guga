<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
<title>Appel téléphonique</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="call">
<h2>☎ Notification d'appel</h2>
<form id="call-form" autocomplete="off">
  <label>Appelant <input name="caller" required placeholder="Nom de la personne" autofocus></label>
  <label>Téléphone <input name="phone" placeholder="06 …"></label>
  <label>Dossier / contact <input name="lookup" placeholder="Rechercher un dossier ou un contact"></label>
  <ul id="lookup-results" class="lookup"></ul>
  <input type="hidden" name="caseId">
  <label>Objet <textarea name="subject" rows="3" placeholder="Motif de l'appel"></textarea></label>
  <label>Transmettre à <select name="forwardedTo" id="forward-to"><option value="">— choisir un avocat —</option></select></label>
  <menu>
    <button type="button" id="call-cancel">Fermer</button>
    <button type="submit" class="primary">Créer la note et le brouillon</button>
  </menu>
  <p id="call-status" class="muted"></p>
</form>
<script type="module" src="js/call.js"></script>
</body>
</html>
